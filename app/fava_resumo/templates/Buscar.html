{% include '_style.html' %}
<style>
.bs { max-width: 1200px; }
.bs .q { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px 8px 6px 16px; }
.bs .q:focus-within { outline: 2px solid var(--fix); outline-offset: 1px; }
.bs .q input { flex: 1; border: 0; background: none; font: 18px var(--font-ui); color: var(--ink); padding: 10px 0; outline: none; }
.bs .q .ico { color: var(--muted); font-size: 18px; }
.bs .ex { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; align-items: center; }
.bs .ex button { all: unset; cursor: pointer; font: 12px var(--font-ui); padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.bs .ex button:hover { color: var(--ink); }
.bs .adv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
.bs .adv label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); font-family: var(--font-ui); }
.bs .adv input, .bs .adv select { font: 13px var(--font-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 8px; text-transform: none; letter-spacing: 0; }
.bs details.advbox summary { cursor: pointer; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.bs .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.bs .chips span { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.bs .sum { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); align-items: baseline; }
.bs .sum b { font-size: 18px; color: var(--ink); }
.bs table.res { width: 100%; font-size: 13px; }
.bs table.res td { padding: 9px 8px; vertical-align: top; }
.bs table.res tr.hit { cursor: pointer; }
.bs table.res tr.hit:hover td { background: var(--surface-2) !important; }
.bs .dsc { font-weight: 500; }
.bs .dsc small, .bs .ct small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; font-weight: 400; }
.bs mark { background: rgba(var(--heat), .28); color: inherit; border-radius: 3px; padding: 0 1px; }
.bs .b { display: inline-block; margin: 2px 4px 2px 0; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 600; }
.bs .b.fx { background: rgba(var(--fix-rgb), .16); color: var(--fix); } .bs .b.vr { background: rgba(var(--var-rgb), .16); color: var(--var); }
.bs .b.pc, .bs .b.mn { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2); }
.bs .b.re { background: rgba(var(--good-rgb), .14); color: var(--good); } .bs .b.pv { background: var(--warn-bg); color: var(--warn-ink); }
.bs .b.rc { background: rgba(var(--good-rgb), .14); color: var(--good); } .bs .b.tr { background: var(--surface-2); color: var(--muted); }
.bs td.v { text-align: right; font-weight: 600; white-space: nowrap; }
.bs td.v.in { color: var(--good); }
.bs tr.det td { background: var(--surface-2) !important; font-size: 12px; color: var(--ink-2); }
.bs tr.det .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 20px; }
.bs tr.det .grid div span { color: var(--muted); }
.bs tr.det .acts { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.bs tr.det .acts a { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 7px; background: var(--surface); color: var(--ink); text-decoration: none; border: 1px solid var(--line-2); }
.bs tr.sep td { font: 600 12px var(--font-ui); color: var(--muted); padding-top: 16px !important; }
.bs tr.hit.exact td { background: rgba(var(--good-rgb), .10) !important; }
.bs tr.hit.exact td:first-child { box-shadow: inset 3px 0 0 var(--good); }
.bs tr.hit.near td { opacity: .62; }
.bs tr.hit.near:hover td { opacity: 1; }
.bs tr.det .acts button { font: 600 12px var(--font-ui); padding: 6px 12px; border-radius: 7px; background: var(--accent); color: var(--on-accent); border: 0; cursor: pointer; }
.bs .empty { padding: 30px; text-align: center; color: var(--muted); }
.bs .more { margin-top: 12px; font: 500 13px var(--font-ui); background: var(--surface-2); color: var(--ink); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
</style>

<script type="application/json" id="bs-data">{{ extension.page_json()|safe }}</script>

<div class="rs bs" id="bs">
  <div class="top"><div><p class="eyebrow">Gastos, receitas e transferências</p><h1>Buscar</h1></div></div>

  <section class="card">
    <div class="q"><span class="ico">⌕</span><input id="bs-q" type="search" placeholder="Ex.: uber set · 33,96 · mercado >100 · ~130 · 21/09 · reembolsável" aria-label="Buscar" autocomplete="off"></div>
    <div class="ex">Exemplos:
      <button type="button" data-ex="uber set">uber set</button>
      <button type="button" data-ex="mercado >100">mercado &gt;100</button>
      <button type="button" data-ex="~130">~130</button>
      <button type="button" data-ex="parcela">parcela</button>
      <button type="button" data-ex="assinatura">assinatura</button>
      <button type="button" data-ex="salário receita">salário receita</button>
    </div>
    <details class="advbox"><summary>Filtros avançados</summary>
      <div class="adv">
        <label>Tipo <select id="f-tipo"><option value="">todos</option><option>gasto</option><option>receita</option><option>transferência</option></select></label>
        <label>Valor de <input id="f-vmin" type="number" step="0.01" placeholder="0,00"></label>
        <label>Valor até <input id="f-vmax" type="number" step="0.01" placeholder="0,00"></label>
        <label>Data de <input id="f-dmin" type="date"></label>
        <label>Data até <input id="f-dmax" type="date"></label>
        <label>Meio <select id="f-meio"><option value="">todos</option></select></label>
        <label>Categoria <select id="f-cat"><option value="">todas</option></select></label>
      </div>
    </details>
    <div class="chips" id="bs-chips"></div>
  </section>

  <section class="card">
    <div class="sum" id="bs-sum"></div>
    <div class="tw" style="margin-top:10px"><table class="res list" id="bs-res"></table></div>
    <button class="more" id="bs-more" type="button" hidden>Mostrar mais</button>
  </section>
</div>
