[project]
name = "finance"
version = "0.1.0"
description = "Controle financeiro pessoal e de MEI, 100% local: Beancount + Fava"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.2",
    "beanquery>=0.2",
    "fava>=1.30",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# não é um pacote instalável: o código roda direto de app/ (python -m app.cli)
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
