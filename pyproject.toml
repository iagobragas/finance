[project]
name = "finance"
version = "0.1.0"
description = "Controle financeiro pessoal e de MEI, 100% local: Beancount + Fava"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.2",
    "beanquery>=0.2",
    "fava>=1.30",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.uv]
# não é um pacote instalável: o código roda direto de app/ (python -m app.cli)
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# erros reais (F, E9), imports (I), armadilhas comuns (B), sintaxe moderna (UP) e extras do ruff (RUF)
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = [
    "E731",  # lambda atribuída a variável: usada de propósito para funções curtas
    "E741",  # nomes como l/i/o
    "B007",  # variável de loop não usada
    "B905",  # zip() sem strict=
    "RUF001", "RUF002", "RUF003",  # travessão e aspas tipográficas em textos em português
    "RUF005", "RUF059",
]
